<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- il logo del negozio (src/images/enoteca-detoma-logo.webp) reso
         quadrato e col fondo bianco dentro l'ovale, o sulle schede scure del
         browser il verde scuro spariva. PNG e non webp: per l'icona della
         scheda è l'unico formato che leggono tutti i browser, Safari compreso -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Marcellus è il font dei NOMI DEI PRODOTTI (card, scheda, fascia in
         home, pannello admin); Cormorant Garamond è tutto il resto del testo
         serif; Great Vibes la firma in home. Marcellus esiste solo a 400: il
         nome del prodotto va scritto a quel peso, non a 700, o il browser lo
         ingrassa da sé.
         I tre font non si caricano più da qui: stanno in src/fonts/, con le
         loro regole in src/fonts/fonts.css (importato da main.jsx). -->
    <title>enoteca-detoma</title>
    <script type="text/javascript">
      // controparte di public/404.html: decodifica il percorso reale
      // dalla query string e lo rimette a posto prima che React Router
      // veda l'URL, così il refresh/link diretto atterra sulla pagina giusta
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
